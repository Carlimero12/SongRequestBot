name: Build

on: [push,pull_request]

jobs:
    build:
        strategy:
            matrix:
                os: [linux,win,osx]
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v4
        - name: Setup .NET
          uses: actions/setup-dotnet@v4
          with:
            dotnet-version: 10.0.x
        - name: Restore dependencies
          run: dotnet restore
        - name: Build
          run: dotnet publish --runtime ${{matrix.os}}-x64
        - name: Upload Artifacts
          uses: actions/upload-artifact@v4
          with:
            name: songrequestbot-${{matrix.os}}
            path: ./bin/Release/net10.0/${{matrix.os}}-x64/publish
